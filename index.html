<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171622"><title>НЕФОРМАТ — два режима</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#14141e;color:#f8f4f6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#41344e 0,transparent 40%),#14141e;min-height:100vh}.app{max-width:720px;margin:auto;padding:20px 15px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 20px}.brand{font-weight:900;letter-spacing:.11em;font-size:21px}.tag{font-size:12px;color:#d4c3dd}.panel{background:#242331;border:1px solid #51465b;border-radius:24px;min-height:520px;box-shadow:0 18px 65px #0005;overflow:hidden}.scene{padding:25px 21px 30px}.eyebrow{color:#d3aedf;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:750;margin-bottom:12px}h1{font-size:clamp(27px,6vw,39px);line-height:1.1;margin:0 0 16px}h2{font-size:20px;margin:0 0 12px}p{line-height:1.6;color:#e2dce5;margin:12px 0}.muted{font-size:12px;color:#b4a9ba}.art{background:linear-gradient(130deg,#5c496b,#363c58 65%,#304748);height:135px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:48px;letter-spacing:7px;margin:14px 0 20px;position:relative}.time{position:absolute;right:14px;bottom:12px;background:#171622bb;border-radius:15px;padding:5px 9px;font-size:12px;letter-spacing:0}.choices,.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.choices{flex-direction:column}.btn{appearance:none;border:1px solid #716580;background:#373345;color:#fff;padding:14px 16px;font-size:15px;font-weight:650;border-radius:13px;text-align:left;cursor:pointer;min-height:47px;touch-action:manipulation}.btn:active{transform:scale(.99)}.btn.primary{background:#c8a7df;color:#231b2b;border-color:#d8b6ec}.btn.soft{background:#2c293a}.btn:disabled{opacity:.45}.row .btn{flex:1;text-align:center}.bubble{padding:16px;border-radius:16px;background:#383348;border-left:3px solid #c8a7df;line-height:1.6;margin:17px 0}.lesson{padding:17px;border-radius:16px;background:#191b28;border:1px solid #565068;margin:16px 0}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:#302d3e;border:1px solid #635671;border-radius:17px;padding:17px 13px;cursor:pointer;text-align:left;color:#fff;min-height:118px}.tile b{display:block;margin:8px 0;font-size:16px}.tile small{color:#c8bccb;line-height:1.4;display:block}.emoji{font-size:27px}.back{background:none;border:none;color:#d7b9ed;font-size:14px;padding:4px 0 18px;cursor:pointer}.feedback{border-radius:12px;padding:13px 15px;margin:14px 0;background:#2e4141;border:1px solid #597b72;line-height:1.5}.feedback.try{background:#433541;border-color:#765d73}.coins{color:#ffe3a0;font-weight:800}.stat{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0;font-size:13px;color:#e7d9e8}.progress{height:7px;background:#484052;border-radius:10px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:#c8a7df}.pill{display:inline-block;background:#40394d;border-radius:20px;padding:5px 10px;font-size:12px;color:#e5d4ee;margin:4px 5px 4px 0}.field{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:12px;background:#151722;border:1px solid #70637a;color:white;margin:8px 0}.groups{display:flex;flex-wrap:wrap;gap:8px}.group{border:1px solid #766485;border-radius:10px;padding:10px;text-align:center;background:#383048;font-size:22px}.footer{color:#988fa1;text-align:center;font-size:11px;padding:20px 8px}.tiny{font-size:13px;color:#cbbdd0}.shopitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:#302c3d;border-radius:13px;margin:9px 0}.shopitem button{flex-shrink:0}.mathstack{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:29px;line-height:1.35;display:inline-block;text-align:right;white-space:pre;border-bottom:2px solid #cab0e3;padding:5px 15px;margin:6px 0}.steps{padding-left:20px;line-height:1.8}.steps li{margin:6px 0}select{background:#181825;color:#fff;border:1px solid #70637a;border-radius:9px;padding:10px;font-size:15px;width:100%}@media(max-width:410px){.scene{padding:21px 16px}.tile{padding:13px 11px}.art{height:120px}.brand{font-size:19px}}
</style></head><body><main class="app"><div class="top"><div class="brand">НЕФОРМАТ <span style="color:#c8a7df">/</span> 02</div><div class="tag" id="topcoins">🪙 0 коинов</div></div><div class="panel"><div id="screen" class="scene" aria-live="polite"></div></div><div class="footer">Тестовая версия 2.0 · без регистрации и покупок · прогресс хранится в этом браузере</div></main><script>
'use strict';
const root=document.getElementById('screen');
const catalog=[
{id:'add',icon:'➕',title:'Сложение столбиком',desc:'Разряды и перенос десятка'},
{id:'sub',icon:'➖',title:'Вычитание столбиком',desc:'Как занимать десяток'},
{id:'mul',icon:'✖️',title:'Умножение',desc:'Группы, таблица и столбик'},
{id:'div',icon:'➗',title:'Деление',desc:'Поровну и деление уголком'},
{id:'motion',icon:'🛹',title:'Задачи на движение',desc:'Скорость, время, расстояние'},
{id:'flats',icon:'🏢',title:'Этажи и квартиры',desc:'Номера квартир и этажей'},
{id:'weight',icon:'⚖️',title:'Масса и объём',desc:'Килограммы, граммы, литры'},
{id:'geometry',icon:'📐',title:'Площадь и периметр',desc:'Длина, ширина, единицы измерения'}
];
let state={coins:0,owned:[],hero:'girl',mentor:'girl',storyDone:0,helped:0};try{const old=JSON.parse(localStorage.getItem('neformat-v2')||'null');if(old&&typeof old==='object')state={...state,...old}}catch(e){}
let mode='story',topic='mul',task=null,attempts=0,hints=0,storyStage=0,storyMood='',feedback='',lastSignature='',helpTab='objects',solved=false;
function persist(){try{localStorage.setItem('neformat-v2',JSON.stringify(state))}catch(e){}document.getElementById('topcoins').textContent='🪙 '+state.coins+' коинов'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(label,fn,kind=''){return `<button type="button" class="btn ${kind}" onclick="${fn}">${label}</button>`}
function draw(html){root.innerHTML=html;persist();window.scrollTo(0,0)}
function back(fn='home()'){return `<button class="back" onclick="${fn}">← Назад</button>`}
function titleFor(id){return catalog.find(x=>x.id===id)?.title||id}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function newTask(id){let a,b,ans,statement,how,object,steps,story,stack='',unit='',detail='';switch(id){
case 'add': a=random([27,38,46,57,68,79]);b=random([15,26,34,47]);ans=a+b;statement=`Сложи столбиком: ${a} + ${b}`;stack=` ${a}\n+${b}`;object=`Разложи ${a} и ${b} на десятки и единицы. Сначала сложи единицы. Если их 10 или больше, собери новый десяток.`;steps=`Сложи единицы: ${a%10} + ${b%10} = ${(a%10)+(b%10)}. ${a%10+b%10>=10?'Запиши последнюю цифру, а 1 десяток перенеси.':'Перенос не нужен.'} Затем сложи десятки с переносом. Ответ: ${ans}.`;story=`У тебя ${a} наклеек, друг подарил ещё ${b}. Сколько стало?`;break;
case 'sub':a=random([52,63,74,85,91]);b=random([18,29,36,47]);if(b>=a)b=18;ans=a-b;statement=`Вычти столбиком: ${a} − ${b}`;stack=` ${a}\n−${b}`;object=`Представь ${a} как десятки и единицы. Если единиц не хватает, обменяй один десяток на 10 единиц.`;steps=`Единицы: ${a%10} − ${b%10}. ${a%10<b%10?`Берём 1 десяток: теперь ${a%10+10} − ${b%10} = ${a%10+10-b%10}. Десятков осталось ${Math.floor(a/10)-1}, вычитаем ${Math.floor(b/10)}.`:`Вычитаем единицы, затем десятки.`} Получается ${ans}.`;story=`Было ${a} стикеров, ${b} раздали друзьям. Сколько осталось?`;break;
case 'mul':a=random([3,4,6,7,8]);b=random([3,4,5,6,7]);ans=a*b;statement=`Сколько будет ${a} × ${b}?`;stack=` ${a}\n×${b}`;object=`Нарисуй ${a} групп по ${b} точек. Пересчитай все точки.`;steps=`Сложи число ${b} ровно ${a} раз: ${Array(a).fill(b).join(' + ')} = ${ans}. Значит, ${a} × ${b} = ${ans}.`;story=`Для друзей купили ${a} упаковок по ${b} наклеек. Сколько наклеек всего?`;break;
case 'div':b=random([2,3,4,5,6]);ans=random([3,4,5,6,7]);a=b*ans;statement=`Раздели ${a} на ${b} поровну.`;stack=`${a} : ${b}`;object=`Разложи ${a} точек в ${b} одинаковых коробочек. Сколько в каждой?`;steps=`Ищи число, которое при умножении на ${b} даёт ${a}. Это ${ans}, потому что ${b} × ${ans} = ${a}.`;story=`Есть ${a} наклеек и ${b} друзей. Сколько достанется каждому поровну?`;break;
case 'motion':b=random([2,3,4,5]);a=random([3,4,5,6]);ans=a*b;unit='км';statement=`Скейтбордист едет со скоростью ${a} км/ч в течение ${b} часов. Какое расстояние он проедет?`;object=`Представь дорогу из ${b} одинаковых участков. За каждый час он проезжает ${a} км.`;steps=`Расстояние = скорость × время. ${a} × ${b} = ${ans} км.`;story=`Герои планируют маршрут. За ${b} часа со скоростью ${a} км/ч сколько километров получится?`;break;
case 'flats':a=random([3,4,5,6]);b=random([2,3,4,5]);ans=(b-1)*a+1;statement=`В доме по ${a} квартиры на этаже. Какой номер у первой квартиры на ${b}-м этаже, если нумерация начинается с 1?`;object=`Нарисуй ${b} этажей, на каждом по ${a} окошек-квартир. Нумеруй с первого этажа.`;steps=`До ${b}-го этажа полностью прошли ${b-1} этажа. Это ${b-1} × ${a} = ${(b-1)*a} квартир. Следующая квартира № ${ans}.`;story=`Друг живёт на ${b}-м этаже, по ${a} квартиры на этаже. С какого номера начинаются квартиры его этажа?`;break;
case 'weight':a=random([2,3,4,5]);b=random([3,4,5,6]);ans=a*b;unit=random(['л','кг']);statement=unit==='л'?`В одной бутылке ${a} л воды. Сколько литров в ${b} таких бутылках?`:`Одна коробка весит ${a} кг. Сколько весят ${b} одинаковых коробок?`;object=unit==='л'?`Нарисуй ${b} бутылок и подпиши на каждой ${a} л. Сложи объёмы.`:`Нарисуй ${b} коробок, каждая по ${a} кг. Сложи их массу.`;steps=`Одинаковая величина повторяется ${b} раз: ${a} × ${b} = ${ans} ${unit}.`;story=unit==='л'?`Для встречи друзей приготовили ${b} бутылок по ${a} л. Сколько всего литров?`:`Для школьного мероприятия принесли ${b} коробок по ${a} кг. Какова общая масса?`;break;
case 'geometry':a=random([3,4,5,6,7]);b=random([2,3,4,5]);detail=random(['area','perimeter']);ans=detail==='area'?a*b:2*(a+b);unit=detail==='area'?'см²':'см';statement=`У прямоугольника длина ${a} см и ширина ${b} см. Найди ${detail==='area'?'площадь':'периметр'}.`;object=detail==='area'?`Представь прямоугольник как сетку из ${a} столбцов и ${b} рядов клеток по 1 см².`:`Обведи пальцем все четыре стороны: ${a} см, ${b} см, ${a} см, ${b} см.`;steps=detail==='area'?`Площадь = длина × ширина: ${a} × ${b} = ${ans} см². Это число единичных квадратов внутри фигуры.`:`Периметр — сумма длин всех сторон: ${a} + ${b} + ${a} + ${b} = ${ans} см.`;story=detail==='area'?`Для прямоугольной наклейки ${a} на ${b} см сколько квадратных сантиметров бумаги нужно?`:`Для прямоугольной наклейки ${a} на ${b} см нужна рамка по краю. Сколько сантиметров рамки понадобится?`;break;
}
return {id,a,b,ans,statement,how:steps,object,story,stack,unit,signature:id+':'+a+':'+b+':'+unit+':'+detail};}
function taskFresh(id){let t;for(let i=0;i<15;i++){t=newTask(id);if(t.signature!==lastSignature)break}lastSignature=t.signature;return t}
function home(){draw(`<div class="eyebrow">Твоя игра · версия 2.0</div><div class="art">🎧 🛹 ✨</div><h1>Здесь можно быть собой</h1><p>Школьные истории, друзья и математика без крика и стыда. Выбирай, чем хочешь заняться.</p><div class="tiles"><button class="tile" onclick="storyStart()"><span class="emoji">🎮</span><b>Моя история</b><small>События, выборы, друзья и коины</small></button><button class="tile" onclick="homework()"><span class="emoji">📚</span><b>Помоги с домашкой</b><small>Темы, объяснения и практика</small></button></div><div class="stat"><span>🪙 <b class="coins">${state.coins}</b> коинов</span><span>Историй пройдено: ${state.storyDone}</span></div><div class="choices">${btn('🛍️ Магазин стикеров','shop()','soft')}</div><p class="muted">Один сюжет можно проходить повторно: задания будут с другими числами.</p>`)}
function storyStart(){mode='story';storyStage=0;draw(`${back()}<div class="eyebrow">Моя история · глава 1</div><h1>Создай героя</h1><div class="art">🧢 🎒 👟</div><p>Выбери персонажа. Наставник — знакомый старшеклассник из твоей школы, а не незнакомец.</p><div class="choices">${btn('👧 Девочка','pickHero("girl")','primary')}${btn('👦 Мальчик','pickHero("boy")')}</div>`)}
function pickHero(g){state.hero=g;draw(`${back('storyStart()')}<div class="eyebrow">Знакомый старший друг</div><h1>Кто помогает?</h1><p>Вы давно знакомы по школьному скейт-клубу. Выбери, с кем твоему герою комфортнее.</p><div class="choices">${btn('🧑🏻‍🎤 Старшеклассница','pickMentor("girl")','primary')}${btn('🧑🏽‍🎤 Старшеклассник','pickMentor("boy")')}</div>`)}
function pickMentor(m){state.mentor=m;draw(`${back('storyStart()')}<div class="eyebrow">Понедельник · перед уроками</div><div class="art">🏫 📲 🎧 <span class="time">08:15</span></div><h1>Сегодня самостоятельная</h1><p>В школьном чате обсуждают математику. Кто-то пишет: «Опять будут вызывать к доске...»</p><div class="bubble">Друг: «После школы встретимся у скейт-площадки? И не переживай из-за контрольной».</div><p>Что ответишь?</p><div class="choices">${btn('«Да, увидимся!»','storyScene("friend")','primary')}${btn('«Мне тревожно из-за математики»','storyScene("worry")')}${btn('«Сначала разберусь с заданием»','storyScene("study")')}</div>`)}
function storyScene(choice){storyMood=choice;const msg=choice==='worry'?'Ты признаёшься другу, что нервничаешь. Он отвечает: «Я рядом, если что».':choice==='study'?'Ты решаешь немного повторить материал. Это твой выбор, а не наказание.':'Ты договариваешься встретиться после уроков.';draw(`${back('storyStart()')}<div class="eyebrow">После урока · школьный двор</div><div class="art">🏫 🛹 🌤️ <span class="time">14:40</span></div><h1>Знакомое лицо</h1><p>${msg}</p><p>У школьной площадки ты встречаешь знакомого старшеклассника из скейт-клуба.</p><div class="bubble">«У меня тоже раньше всё путалось. Хочешь, покажу умножение на стикерах? Можно без спешки».</div><div class="choices">${btn('«Давай попробуем»','startPractice("mul","story")','primary')}${btn('«Сначала хочу просто поговорить»','storyTalk()','soft')}</div>`)}
function storyTalk(){draw(`${back('storyScene("friend")')}<div class="eyebrow">Разговор у школы</div><h1>Не обязательно быть идеальным</h1><div class="bubble">«Когда кто-то смеётся над ошибкой, это неприятно. Но это не значит, что ты глупый. Если в классе обижают, можно обратиться к взрослому, которому доверяешь».</div><p>Вы ещё немного разговариваете, а потом решаете разобрать один пример вместе.</p>${btn('Попробовать умножение','startPractice("mul","story")','primary')}`)}
function homework(){mode='homework';draw(`${back()}<div class="eyebrow">Режим «Помоги с домашкой»</div><h1>Что разберём?</h1><p>Выбери тему. Можно повторять задания сколько угодно: числа будут меняться.</p><div class="tiles">${catalog.map(t=>`<button class="tile" onclick="startPractice('${t.id}','homework')"><span class="emoji">${t.icon}</span><b>${t.title}</b><small>${t.desc}</small></button>`).join('')}</div><p class="muted">Пока это подборка учебных задач по темам. Ввод собственной задачи и подробный тренажёр столбиком добавим позже.</p>`)}
function startPractice(id,from){mode=from;topic=id;task=taskFresh(id);attempts=0;hints=0;feedback='';solved=false;renderTask()}
function renderTask(){const isStory=mode==='story';draw(`${back(isStory?'home()':'homework()')}<div class="eyebrow">${isStory?'Самостоятельная · глава 1':'Помоги с домашкой'} · ${titleFor(topic)}</div><h1>${isStory?'Попробуем вместе':'Разбираем задачу'}</h1>${isStory?'<p>Наставник: «Не торопись. Можешь посмотреть объяснение разными способами».</p>':''}<div class="lesson"><h2>${esc(task.statement)}</h2>${['add','sub','mul','div'].includes(topic)?`<div class="mathstack">${esc(task.stack)}</div>`:''}<p class="tiny">Ответ ${task.unit?'в '+task.unit:''}:</p><input id="answer" class="field" type="number" inputmode="numeric" placeholder="Введи число" aria-label="Ответ"><div class="choices">${btn('Проверить ответ','checkAnswer()','primary')}</div></div>${feedback?`<div class="feedback ${solved?'':'try'}">${feedback}</div>`:''}<div class="choices">${btn('🧩 Покажи на предметах','showHelp("objects")','soft')}${btn('🪜 Разбери по шагам','showHelp("steps")','soft')}${btn('🌆 Пример из жизни','showHelp("story")','soft')}${btn('🔄 Другой пример по этой теме','startPractice("'+topic+'","'+mode+'")','soft')}</div>`);let el=document.getElementById('answer');if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()})}
function showHelp(which){hints++;helpTab=which;let content=which==='objects'?task.object:which==='steps'?task.how:task.story;draw(`${back('renderTask()')}<div class="eyebrow">Другой способ объяснения</div><h1>${which==='objects'?'Посмотрим наглядно':which==='steps'?'Разберём по шагам':'Представим в жизни'}</h1><div class="art">${which==='objects'?'🧩 🔢':which==='steps'?'📝 ✏️':'🏙️ 🛹'}</div><div class="bubble">${esc(content)}</div><p>Ты можешь вернуться к примеру или попробовать другой способ. Подсказки не заканчиваются.</p><div class="choices">${btn('Вернуться к заданию','renderTask()','primary')}${which!=='objects'?btn('Покажи на предметах','showHelp("objects")','soft'):''}${which!=='steps'?btn('Разбери по шагам','showHelp("steps")','soft'):''}${which!=='story'?btn('Пример из жизни','showHelp("story")','soft'):''}</div>`)}
function checkAnswer(){if(solved)return;const el=document.getElementById('answer');const v=el?.value.trim();if(v===''||!Number.isFinite(Number(v))){feedback='Введи число — и проверим вместе.';renderTask();return}if(Number(v)===task.ans){solved=true;const reward=hints===0&&attempts===0?10:5;state.coins+=reward;state.helped++;if(mode==='story')state.storyDone++;persist();draw(`<div class="eyebrow">Получилось!</div><div class="art">✨ 🪙 🎉</div><h1>Верно: ${task.ans}${task.unit?' '+task.unit:''}</h1><p>Ты разобрался с примером. ${hints?'Подсказки помогли — это тоже результат.':'Отличная самостоятельная работа!'}</p><div class="bubble">+${reward} коинов! Теперь у тебя <span class="coins">${state.coins}</span>.</div><div class="choices">${mode==='story'?btn('После школы →','storyAfter()','primary'):btn('Следующий пример','startPractice("'+topic+'","homework")','primary')}${mode==='story'?btn('Повторить историю с новыми числами','storyStart()','soft'):btn('К списку тем','homework()','soft')}${btn('В главное меню','home()','soft')}</div>`)}else{attempts++;feedback='Пока не совпало. Попробуй другой способ объяснения или проверь вычисление. За ошибку коины не отнимаются.';renderTask()}}
function storyAfter(){draw(`${back('home()')}<div class="eyebrow">После школы · скейт-площадка</div><div class="art">🛹 🍦 🧷 <span class="time">16:10</span></div><h1>Своя жизнь после уроков</h1><p>Ты встречаешь друзей. Никто не спрашивает, сколько ошибок было на самостоятельной. Сегодня можно просто пообщаться и выбрать наклейки.</p><div class="bubble">Друг: «Заглянем в магазин? Там новые стикеры для скейта!»</div><div class="choices">${btn('В магазин стикеров','shop()','primary')}${btn('Пройти эту историю ещё раз','storyStart()','soft')}${btn('Главное меню','home()','soft')}</div>`)}
const goods=[{id:'sticker',name:'Набор наклеек',icon:'🌟',price:10},{id:'icecream',name:'Мороженое после школы',icon:'🍦',price:15},{id:'board',name:'Стикер для скейта',icon:'🛹',price:20},{id:'hoodie',name:'Нашивка на худи',icon:'🧷',price:25}];
function shop(){draw(`${back()}<div class="eyebrow">Магазин после школы</div><h1>Выбирай свой стиль</h1><div class="art">🛍️ 🌟 🍦</div><p>Твои коины: <span class="coins">${state.coins}</span>. Покупки только игровые, настоящие деньги не нужны.</p>${goods.map(g=>`<div class="shopitem"><span>${g.icon} ${g.name}<br><small class="muted">${g.price} коинов</small></span>${btn(state.owned.includes(g.id)?'Куплено':state.coins>=g.price?'Купить':'Не хватает',`buy('${g.id}')`,state.owned.includes(g.id)?'soft':'primary')}</div>`).join('')}<div class="choices">${btn('Вернуться к истории','storyStart()','soft')}${btn('В главное меню','home()','soft')}</div>`)}
function buy(id){const g=goods.find(x=>x.id===id);if(!g||state.owned.includes(id)||state.coins<g.price)return;state.coins-=g.price;state.owned.push(id);shop()}
persist();home();
</script></body></html>
