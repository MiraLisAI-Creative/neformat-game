<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НЕФОРМАТ — тест слоёв</title><style>*{box-sizing:border-box}body{margin:0;background:#181722;color:#f9f5ff;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:18px}h1{font-size:22px;letter-spacing:.08em}p{color:#c9c1d4}.avatar{width:min(100%,380px);aspect-ratio:1;margin:10px auto;border-radius:22px;background:radial-gradient(circle at 50% 36%,#645478,#302d43 68%);position:relative;overflow:hidden}.avatar img{position:absolute;width:100%;height:100%;left:0;top:0;pointer-events:none}section{background:#292637;border:1px solid #544a63;padding:14px;border-radius:15px;margin:12px 0}h2{font-size:15px;margin:0 0 10px}.choices{display:flex;flex-wrap:wrap;gap:8px}button{background:#3b354b;color:white;border:1px solid #78698b;border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer}button.active{background:#ad8ac8;color:#1c1528;border-color:#d8b9ee;font-weight:700}.note{font-size:12px;color:#afa5bd}</style></head><body><main class="wrap"><h1>НЕФОРМАТ / СЛОИ 01</h1><p>Первый технический тест: детали героя меняются отдельно, без генерации новых картинок.</p><div class="avatar" id="avatar"></div><div id="controls"></div><p class="note">Это технический набор слоёв, а не утверждённая финальная рисовка. Настройки сохраняются в этом браузере.</p></main><script>
const groups=[['face','Форма лица',[['round','Круглое'],['oval','Овальное'],['angular','Угловатое']]],['eyes','Глаза',[['round','Круглые'],['almond','Миндалевидные'],['narrow','Узкие']]],['brows','Брови',[['soft','Мягкие'],['straight','Прямые'],['arched','С изгибом']]],['nose','Нос',[['button','Маленький'],['straight','Прямой'],['wide','Широкий'],['upturned','Вздёрнутый']]],['lips','Губы',[['soft','Средние'],['full','Пухлые'],['thin','Тонкие']]],['ears','Уши',[['small','Небольшие'],['medium','Выраженные']]],['style','Причёска',[['bob','Каре'],['long','Длинные'],['bun','Пучок']]],['color','Цвет волос',[['chestnut','Каштан'],['blonde','Блонд'],['violet','Лиловый']]],['body','Одежда',[['hoodie','Лавандовая'],['black','Чёрная'],['cream','Молочная']]]];
const defaults={face:'round',eyes:'round',brows:'soft',nose:'button',lips:'soft',ears:'small',style:'bob',color:'chestnut',body:'hoodie'};
let state={...defaults};try{state={...defaults,...JSON.parse(localStorage.getItem('neformat_layer_test')||'{}')}}catch(e){}
const avatar=document.getElementById('avatar'),controls=document.getElementById('controls');
function render(){let hair=state.style+'_'+state.color;let layers=[['body',state.body],['hairback',hair],['ears',state.ears],['face',state.face],['eyes',state.eyes],['brows',state.brows],['nose',state.nose],['lips',state.lips],['hairfront',hair]];avatar.replaceChildren(...layers.map(([a,b])=>{let im=document.createElement('img');im.src='assets/'+a+'_'+b+'.png';im.alt='';return im}));controls.replaceChildren(...groups.map(([key,title,options])=>{let section=document.createElement('section'),h=document.createElement('h2'),row=document.createElement('div');h.textContent=title;row.className='choices';options.forEach(([value,label])=>{let b=document.createElement('button');b.type='button';b.textContent=label;b.className=value===state[key]?'active':'';b.addEventListener('click',()=>{state[key]=value;try{localStorage.setItem('neformat_layer_test',JSON.stringify(state))}catch(e){}render()});row.append(b)});section.append(h,row);return section}));}
render();
</script></body></html>
