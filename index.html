<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181923"><title>НЕФОРМАТ — глава 1</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f5f0ed;background:#13151e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% 0,#393046 0,transparent 48%),#13151e}.app{max-width:850px;margin:auto;padding:18px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:.11em;font-size:1.05rem}.tag{font-size:.75rem;color:#c6b9d2}.panel{margin-top:18px;background:#222431;border:1px solid #454150;border-radius:23px;overflow:hidden;box-shadow:0 20px 50px #0003}.scene{padding:23px}.eyebrow{color:#cbb1e7;font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;font-weight:750}h1{font-size:clamp(1.5rem,5vw,2.4rem);margin:10px 0 12px;line-height:1.14}h2{font-size:1.25rem;margin:6px 0 10px}p{line-height:1.56;color:#e1dbe5}.muted{color:#b8b2bf;font-size:.9rem}.art{min-height:165px;background:linear-gradient(135deg,#393449,#232735);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:20px;font-size:3.7rem;margin-bottom:20px;position:relative;overflow:hidden}.art:before{content:'';position:absolute;bottom:0;left:0;right:0;height:25%;background:#2d2b3b}.art span{z-index:1}.art .time{position:absolute;top:12px;right:14px;font-size:.85rem;color:#fff9;background:#1118;padding:6px 9px;border-radius:8px}.choices{display:grid;gap:10px;margin-top:20px}.btn{border:1px solid #6b6274;border-radius:14px;background:#343341;color:#fff;font:inherit;padding:13px 16px;text-align:left;cursor:pointer;min-height:46px}.btn:active{transform:scale(.99)}.btn.primary{background:#cbb0ed;color:#171320;border-color:#cbb0ed;font-weight:800;text-align:center}.btn.soft{background:#2b2c3a}.btn:disabled{opacity:.4}.row{display:flex;flex-wrap:wrap;gap:10px}.row .btn{flex:1}.bubble{background:#333544;border-left:3px solid #bda2e6;border-radius:10px;padding:13px 15px;margin:12px 0;color:#f4effa}.lesson{background:#181b27;border-radius:15px;padding:14px;margin:15px 0}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0}.group{border:1px solid #62536e;background:#343143;border-radius:13px;padding:12px 5px;text-align:center}.group b{display:block;font-size:1.35rem;letter-spacing:4px}.group small{color:#c7c0cf}.feedback{border-radius:12px;background:#303b38;padding:12px;margin-top:12px}.error{background:#40333b}.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;color:#cfc4d9}.coins{color:#ffdd8e;font-weight:800}.runner{background:linear-gradient(#43415c,#63536b 64%,#363544 64%);height:230px;border-radius:16px;position:relative;overflow:hidden;touch-action:manipulation}.runner .ground{position:absolute;bottom:0;width:100%;height:30%;background:repeating-linear-gradient(90deg,#2a2935 0 70px,#35313f 70px 75px)}.avatar{position:absolute;left:14%;bottom:29%;font-size:3.1rem;transition:bottom .2s;z-index:2}.avatar.jump{bottom:58%}.pickup{position:absolute;bottom:47%;font-size:2rem;transition:left .16s linear}.controls{display:flex;gap:10px;margin-top:10px}.controls .btn{text-align:center}.progress{height:7px;background:#353343;border-radius:6px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#c9a6ed;transition:width .25s}.hidden{display:none}.footer{color:#898593;font-size:.75rem;margin-top:18px;text-align:center}button:focus-visible{outline:3px solid #f2c56e;outline-offset:3px}@media(max-width:400px){.scene{padding:16px}.art{min-height:140px;font-size:3rem}.groups{gap:5px}.group b{font-size:1.05rem;letter-spacing:1px}}
</style></head><body><main class="app"><div class="top"><div class="brand">НЕФОРМАТ <span style="color:#c4a5e4">/</span> 01</div><div class="tag">Пробная глава · 0 ₽</div></div><div class="panel"><div id="screen" class="scene" aria-live="polite"></div></div><div class="footer">Прототип для тестирования · без аккаунта, рекламы и покупок · прогресс хранится на этом устройстве</div></main><script>
const root=document.getElementById('screen');let gender='girl',mentor='girl',step='start',score=0,question=0,attempt=0,runnerCount=0,runnerTimer=null,jumping=false;const icon=()=>gender==='girl'?'🛹':'🚲',name=()=>gender==='girl'?'героиня':'герой';function save(){try{localStorage.setItem('neformat-demo',JSON.stringify({step,gender,mentor,score}))}catch(e){}}function set(html){root.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});save()}function button(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function art(emoji,time=''){return `<div class="art"><span>${emoji}</span>${time?`<span class="time">${time}</span>`:''}</div>`}function start(){step='start';set(`<div class="eyebrow">Интерактивная история · 8–12 минут</div>${art('📱 🛹 🎧','Глава 1')}<h1>Утро не по плану</h1><p>Школа, друзья, самостоятельная и один неожиданный разговор по дороге. Здесь можно ошибаться, просить подсказки и играть в своём темпе.</p><div class="choices">${button('Начать историю','chooseHero()','primary')}</div><p class="muted">Временная графика: проверяем историю и обучение, а не внешний вид персонажей.</p>`)}function chooseHero(){step='hero';set(`<div class="eyebrow">Создание персонажа</div><h1>Кем играем?</h1>${art('🧢 🎒 👟')}<p>Внешность и одежду добавим позже. Сейчас выбери персонажа для диалогов.</p><div class="choices">${button('Девочка','gender="girl";morning()')}${button('Мальчик','gender="boy";morning()')}</div>`)}function morning(){step='morning';set(`<div class="eyebrow">Сцена 1 · понедельник</div>${art('⏰ 📲 🎒','07:30')}<h1>Опять эта математика...</h1><div class="bubble">Школьный чат: «Напоминаю: сегодня самостоятельная. Умножение».</div><p>Вчера ты пытался${gender==='girl'?'а':''} разобраться, но примеры всё равно путаются. В животе неприятно сжимается.</p><p>Друг пишет: «После школы идём кататься?»</p><div class="choices">${button('Ответить другу','reaction("friend")')}${button('Ещё минуту полежать','reaction("sleep")')}${button('Собраться и выйти','reaction("go")')}</div>`)}function reaction(r){step='street';let msg=r==='friend'?'«Да, увидимся после школы!» — отправлено.':r==='sleep'?'Ты ещё немного лежишь, потом всё-таки собираешься.':'Ты берёшь рюкзак и выходишь из дома.';set(`<div class="eyebrow">Сцена 2 · дорога</div>${art('🏙️ 🚏 🎧','07:50')}<h1>Случайная встреча</h1><p>${msg}</p><p>У остановки кто-то в огромной худи замечает, как ты смотришь на тетрадь.</p><div class="bubble">«Тоже утро не задалось? Могу показать одну штуку с умножением. Без лекций».</div><p>Кто будет помогать?</p><div class="choices">${button('Наставница','mentor="girl";lessonIntro()')}${button('Наставник','mentor="boy";lessonIntro()')}</div>`)}function lessonIntro(){step='lesson';let who=mentor==='girl'?'Наставница':'Наставник';set(`<div class="eyebrow">Сцена 3 · короткое объяснение</div>${art(mentor==='girl'?'🧑🏻‍🎤 📱':'🧑🏽‍🎤 📱')}<h1>Умножение — это не магия</h1><div class="bubble">${who}: «Не надо сейчас вспоминать всю таблицу. Сначала поймём, что означает знак ×».</div><p>Представь три одинаковых набора стикеров. В каждом — по четыре. Сколько всего?</p><div class="lesson"><div class="groups"><div class="group"><b>★ ★<br>★ ★</b><small>4</small></div><div class="group"><b>★ ★<br>★ ★</b><small>4</small></div><div class="group"><b>★ ★<br>★ ★</b><small>4</small></div></div><p>Можно сложить: <strong>4 + 4 + 4 = 12</strong>.</p><p>А можно короче: <strong>3 × 4 = 12</strong>. Это три группы по четыре.</p></div><div class="choices">${button('Покажи ещё проще','lessonSimple()')}${button('Кажется, понял(а). Попробую','practice(0)','primary')}</div>`)}function lessonSimple(){step='simple';set(`<div class="eyebrow">Ещё проще</div><h1>Считаем прыжками</h1><p>Начинаем с нуля. Каждый шаг добавляет 4:</p><div class="lesson"><h2 style="text-align:center">0 → 4 → 8 → 12</h2><p>Сделали три одинаковых шага по четыре. Пришли к 12.</p><p><strong>3 × 4 = 12</strong>. Первая цифра — сколько групп, вторая — сколько в каждой.</p></div><div class="bubble">«Если забываешь таблицу, пока можно просто считать группами. Скорость придёт потом».</div>${button('Теперь попробую','practice(0)','primary')}`)}const tasks=[{groups:2,size:3,opts:[5,6,8]},{groups:4,size:2,opts:[6,8,10]},{groups:3,size:5,opts:[12,15,18]}];function practice(i){question=i;attempt=0;step='practice';renderQuestion()}function renderQuestion(feedback=''){const t=tasks[question];set(`<div class="eyebrow">Сцена 4 · самостоятельная · ${question+1}/3</div>${art('📓 ✏️','08:40')}<h1>Ты можешь разобраться</h1><p>В примере <strong>${t.groups} × ${t.size}</strong> — это ${t.groups} одинаковые группы по ${t.size} предмета. Сколько всего?</p><div class="row">${t.opts.map(n=>button(String(n),`checkAnswer(${n})`)).join('')}</div>${feedback?`<div class="feedback ${attempt?'error':''}">${feedback}</div>`:''}<div class="choices">${button('Показать группы',`showGroups()`,'soft')}${button('Вернуться к объяснению','lessonIntro()','soft')}</div><div class="progress"><div style="width:${question/3*100}%"></div></div>`)}function showGroups(){const t=tasks[question];const groups=Array.from({length:t.groups},(_,i)=>`<div class="group"><b>${'● '.repeat(t.size)}</b><small>Группа ${i+1}</small></div>`).join('');set(`<div class="eyebrow">Подсказка</div><h1>Посчитаем вместе</h1><p>Вот ${t.groups} группы. В каждой по ${t.size} точек.</p><div class="groups">${groups}</div><p>Складываем одинаковые числа: <strong>${Array(t.groups).fill(t.size).join(' + ')}</strong>.</p><div class="bubble">Попробуй посчитать все точки. Ошибиться здесь не страшно.</div>${button('Вернуться к заданию','renderQuestion()','primary')}`)}function checkAnswer(n){const t=tasks[question],correct=t.groups*t.size;if(n===correct){score++;if(question<tasks.length-1){set(`<div class="eyebrow">Получилось!</div>${art('✨ 🎉')}<h1>Да, ${t.groups} × ${t.size} = ${correct}</h1><p>Ты не угадал${gender==='girl'?'а':''}, а разобрал${gender==='girl'?'ась':'ся'} в группах. Это и есть главное.</p>${button('Следующий пример',`practice(${question+1})`,'primary')}`)}else{schoolEnd()}}else{attempt++;renderQuestion(`Пока не совпало. Подсказка: представь ${t.groups} группы по ${t.size}. Можешь нажать «Показать группы» и посчитать вместе.`)}}function schoolEnd(){step='afterclass';set(`<div class="eyebrow">После уроков</div>${art('🏫 ☀️ 🛹','15:20')}<h1>Не всё идеально. Но кое-что получилось.</h1><p>Самостоятельная закончилась. Ты разобрал${gender==='girl'?'ась':'ся'} с тремя заданиями, используя смысл умножения.</p><div class="bubble">Сообщение от друга: «Мы уже на площадке. Ты где?»</div><p>Время немного покататься. Не ради оценки — просто потому, что после школы есть своя жизнь.</p>${button('На площадку!','startRunner()','primary')}`)}function startRunner(){step='runner';runnerCount=0;drawRunner();}function drawRunner(){set(`<div class="eyebrow">Сцена 5 · скейт-площадка</div><h1>Поймай 5 монет</h1><p>Нажимай «Прыгнуть», когда монета приблизится к персонажу. Если пропустишь — ничего страшного.</p><div class="stat"><span>Монеты: <span id="count" class="coins">${runnerCount}/5</span></span><span>Прыжки без штрафов</span></div><div class="runner" id="runner"><div class="ground"></div><div class="avatar" id="avatar">${icon()}</div><div class="pickup" id="pickup" style="left:88%">🟡</div></div><div class="controls">${button('⬆ Прыгнуть','jump()','primary')}${button('Пропустить уровень','storeIntro()','soft')}</div><p class="muted">Простой игровой набросок: здесь пока нет настоящей физики и анимации.</p>`);let pos=88;clearInterval(runnerTimer);runnerTimer=setInterval(()=>{if(step!=='runner'){clearInterval(runnerTimer);return}pos-=2.7;if(pos<8){pos=88}const el=document.getElementById('pickup');if(el)el.style.left=pos+'%';window._coinPos=pos},75)}function jump(){if(step!=='runner'||jumping)return;jumping=true;const a=document.getElementById('avatar');if(a)a.classList.add('jump');if(window._coinPos>=9&&window._coinPos<=38){runnerCount++;document.getElementById('count').textContent=runnerCount+'/5';window._coinPos=88;document.getElementById('pickup').style.left='88%';if(runnerCount>=5){clearInterval(runnerTimer);setTimeout(storeIntro,350);return}}setTimeout(()=>{jumping=false;const el=document.getElementById('avatar');if(el)el.classList.remove('jump')},480)}function storeIntro(){clearInterval(runnerTimer);step='store';set(`<div class="eyebrow">Бонус · магазин стикеров</div>${art('🛍️ 🧷 🎒')}<h1>Соберём свой стиль?</h1><p>После катания друзья заходят в магазин стикеров. Один набор — 4 наклейки. Хочется взять три набора, чтобы украсить рюкзак.</p><p>Сколько наклеек получится?</p><div class="row">${[7,12,16].map(n=>button(String(n),`storeAnswer(${n})`)).join('')}</div>${button('Посчитать на картинке','storeHint()','soft')}`)}function storeHint(){set(`<div class="eyebrow">Можно без спешки</div><h1>Три набора по четыре</h1><div class="groups">${[1,2,3].map(i=>`<div class="group"><b>★ ★<br>★ ★</b><small>Набор ${i}</small></div>`).join('')}</div><p>4 + 4 + 4 = 12. Это те же самые три группы, которые мы видели утром.</p>${button('Закончить главу','finish()','primary')}`)}function storeAnswer(n){if(n===12)finish();else storeHint()}function finish(){step='finish';set(`<div class="eyebrow">Глава 1 завершена</div>${art('🛹 ✨ 🧷')}<h1>Маленькая победа</h1><p>Сегодня ты понял${gender==='girl'?'а':''}, что умножение — это одинаковые группы. И применил${gender==='girl'?'а':''} это не только в классе.</p><div class="bubble">Наставник: «Необязательно знать всё сразу. Разбираемся по одному шагу».</div><p>Открыт виртуальный стикер для рюкзака. Продолжение истории пока в разработке.</p><div class="choices">${button('Пройти ещё раз','start()','primary')}${button('Повторить объяснение','lessonIntro()','soft')}</div><p class="muted">Для взрослых: это демонстрация одного понятия, а не проверенная методика коррекции учебных трудностей. Обратите внимание, где ребёнку понадобились подсказки.</p>`)}window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&step==='runner'){e.preventDefault();jump()}});start();
</script></body></html>
